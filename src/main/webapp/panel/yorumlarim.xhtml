<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/panelTemplate.xhtml">

    <f:metadata>
        <f:viewAction action="#{yorumlarimBean.hazirla}"/>
    </f:metadata>

    <ui:define name="title">DevLog — Yorumlarım</ui:define>

    <ui:define name="content">
        <header class="mb-4 pb-4 border-bottom border-secondary border-opacity-25">
            <span class="devlog-mono-label text-primary mb-1 d-block">/panel/yorumlarim</span>
            <h1 class="devlog-headline mb-2" style="font-size: 1.5rem;">Yorumlarım</h1>
            <p class="devlog-term-log-prompt font-monospace small text-secondary mb-0">&gt; tail -f yorumlar.log</p>
        </header>

        <div class="devlog-term-log border border-secondary border-opacity-25 rounded-0 font-monospace small">
            <ui:fragment rendered="#{empty yorumlarimBean.yorumlar}">
                <div class="devlog-term-log__line px-3 py-3 text-secondary">(boş) — henüz kayıtlı yorum yok.</div>
            </ui:fragment>
            <ui:repeat value="#{yorumlarimBean.yorumlar}" var="y">
                <div class="devlog-term-log__line border-bottom border-secondary border-opacity-25 px-3 py-2">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-1">
                        <div class="text-white min-w-0">
                            <span class="text-secondary">blog#</span>#{y.blog.id}
                            <span class="mx-2 text-secondary">·</span>
                            <span class="text-truncate d-inline-block align-bottom" style="max-width: 14rem;">#{y.blog.baslik}</span>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-shrink-0">
                            <span class="text-secondary" style="font-size: 0.7rem;">#{yorumlarimBean.tarihMetni(y)}</span>
                            <h:link outcome="/public/blog-detay" styleClass="btn btn-sm btn-outline-primary rounded-0 font-monospace py-0 px-2">
                                <f:param name="id" value="#{y.blog.id}"/>
                                Aç
                            </h:link>
                        </div>
                    </div>
                    <div class="text-secondary" style="font-size: 0.75rem; white-space: pre-wrap;">#{y.metin}</div>
                </div>
            </ui:repeat>
        </div>
    </ui:define>
</ui:composition>
