<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <header class="devlog-panel-header d-flex align-items-center justify-content-between px-3 px-lg-4 py-2">
        <div class="d-flex align-items-center gap-2 gap-md-3 flex-grow-1 min-w-0">
            <button type="button" class="btn btn-link text-secondary d-lg-none p-1 me-1 border-0" data-bs-toggle="offcanvas"
                    data-bs-target="#panelOffcanvas" aria-controls="panelOffcanvas" aria-label="Menü">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <span class="devlog-panel-breadcrumb font-monospace small text-truncate d-none d-sm-inline">~/panel/bloglarim</span>
            <div class="devlog-panel-search-wrap d-none d-md-flex align-items-center px-2 py-1 ms-md-2">
                <span class="material-symbols-outlined text-secondary me-1" style="font-size: 1rem;">search</span>
                <input type="search" class="devlog-panel-search-input" placeholder="Blog ara..." aria-label="Blog ara"/>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2 gap-md-4 flex-shrink-0">
            <span class="small d-none d-md-inline text-white">
                Hoş geldin, <span class="devlog-panel-welcome-name">#{oturum.girisYapildi and oturum.aktifKullanici != null ? oturum.aktifKullanici.kullaniciAdi : 'Misafir'}</span>
            </span>
            <div class="d-flex align-items-center gap-2 text-secondary">
                <span class="material-symbols-outlined" style="cursor: pointer;" title="Bildirimler">notifications</span>
                <span class="material-symbols-outlined d-none d-sm-inline" style="cursor: pointer;" title="Terminal">terminal</span>
                <span class="material-symbols-outlined" style="cursor: pointer;" title="Ayarlar">settings</span>
            </div>
        </div>
    </header>
</ui:composition>
