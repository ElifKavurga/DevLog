<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <header class="devlog-public-header devlog-public-header--ide border-bottom sticky-top z-3">
        <div class="container-fluid px-0">
            <div class="container py-2">
                <div class="devlog-public-header--ide__row d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <div class="d-flex align-items-center gap-2 gap-md-4 min-w-0">
                        <button type="button" class="btn btn-link text-secondary p-1 border-0 flex-shrink-0 devlog-global-menu-btn" data-bs-toggle="offcanvas"
                                data-bs-target="#devlogGlobalOffcanvas" aria-controls="devlogGlobalOffcanvas" aria-label="Menüyü aç">
                            <span class="material-symbols-outlined" aria-hidden="true">terminal</span>
                        </button>
                        <h:link outcome="/public/index" styleClass="devlog-public-header--ide__brand text-decoration-none flex-shrink-0" title="Ana sayfa">
                            <h:graphicImage library="img" name="Logo.png" alt="Ana sayfa" styleClass="devlog-public-header--ide__logo"/>
                        </h:link>
                        <nav class="d-none d-md-flex align-items-center gap-3 gap-lg-4">
                            <h:link outcome="/public/index" styleClass="devlog-public-nav-link devlog-public-header--ide__nav text-uppercase #{view.viewId.endsWith('/public/index.xhtml') ? 'active' : ''}">Keşfet</h:link>
                            <h:link outcome="/public/kategoriler" styleClass="devlog-public-nav-link devlog-public-header--ide__nav text-uppercase #{view.viewId.endsWith('/public/kategoriler.xhtml') ? 'active' : ''}">Kategoriler</h:link>
                            <h:link outcome="/public/hakkimizda" styleClass="devlog-public-nav-link devlog-public-header--ide__nav text-uppercase #{view.viewId.endsWith('/public/hakkimizda.xhtml') ? 'active' : ''}">Hakkımızda</h:link>
                        </nav>
                    </div>
                    <div class="d-flex align-items-center gap-2 gap-md-3 flex-shrink-0 ms-md-auto flex-wrap justify-content-end">
                        <span class="d-none d-xl-inline font-monospace small text-secondary text-truncate devlog-panel-header__path" title="#{panelYolController.kisaYol}">
                            #{panelYolController.kisaYol}
                        </span>
                        <h:panelGroup rendered="#{not oturumController.girisYapildi}" layout="block" styleClass="d-flex align-items-center gap-2">
                            <h:link outcome="/auth/giris" styleClass="btn devlog-public-btn-outline devlog-public-header--ide__btn rounded-0 px-3 py-2 text-decoration-none text-uppercase small">Giriş yap</h:link>
                            <h:link outcome="/auth/kayit" styleClass="btn devlog-public-btn-primary devlog-public-header--ide__btn-primary rounded-0 px-3 py-2 text-decoration-none text-uppercase small">Kayıt ol</h:link>
                        </h:panelGroup>
                        <h:panelGroup rendered="#{oturumController.girisYapildi}" layout="block" styleClass="d-flex align-items-center gap-2 flex-wrap">
                            <h:form styleClass="d-flex align-items-center gap-2 flex-wrap mb-0">
                                <span class="position-relative d-inline-block align-middle">
                                    <h:commandLink action="#{bildirimController.zilTiklaVeListeyeGit}"
                                                   styleClass="btn btn-link text-secondary p-1 border-0 text-decoration-none devlog-header-notif-btn"
                                                   title="Bildirimler">
                                        <span class="material-symbols-outlined" style="font-size: 1.35rem;" aria-hidden="true">notifications</span>
                                        <h:panelGroup rendered="#{bildirimController.okunmamisSayisi > 0}"
                                                      styleClass="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-dark rounded-circle devlog-header-notif-dot"/>
                                    </h:commandLink>
                                </span>
                                <h:commandLink action="#{oturumController.menuGitBloglarim}" rendered="#{oturumController.yazmayaYetkili}"
                                               styleClass="btn devlog-public-btn-outline devlog-public-header--ide__btn rounded-0 px-2 px-md-3 py-2 small text-decoration-none d-none d-md-inline-block text-uppercase">
                                    Bloglarım
                                </h:commandLink>
                                <h:commandLink action="#{oturumController.menuGitYeniBlog}" rendered="#{oturumController.yazmayaYetkili}"
                                               styleClass="btn devlog-public-btn-primary devlog-public-header--ide__btn-primary rounded-0 px-2 px-md-3 py-2 small text-decoration-none d-none d-lg-inline-block text-uppercase">
                                    Yeni Blog Ekle
                                </h:commandLink>
                                <h:link outcome="/panel/profil"
                                        styleClass="font-monospace small devlog-public-header--ide__username devlog-header-profile-link text-truncate d-none d-sm-inline"
                                        title="#{oturumController.aktifKullanici.kullaniciAdi}">
                                    #{oturumController.aktifKullanici.kullaniciAdi}
                                </h:link>
                                <h:commandLink action="#{oturumController.cikisYap}" styleClass="btn devlog-public-btn-outline devlog-public-header--ide__btn rounded-0 px-2 py-2 border-0 text-decoration-none small text-uppercase">
                                    Çıkış
                                </h:commandLink>
                            </h:form>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </header>
</ui:composition>
