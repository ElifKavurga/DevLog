<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <header class="devlog-header border-bottom sticky-top z-3">
        <div class="devlog-container-max px-3 px-md-4">
            <div class="d-flex justify-content-between align-items-center py-2 py-md-0" style="min-height: 4rem;">
                <div class="d-flex align-items-center gap-4">
                    <h:link outcome="index" styleClass="d-flex align-items-center text-decoration-none" title="Ana sayfa">
                        <h:graphicImage library="img" name="Logo.png" alt="DevLog" styleClass="devlog-logo"/>
                    </h:link>
                    <nav class="d-none d-md-flex align-items-center gap-4">
                        <h:link outcome="index" styleClass="devlog-nav-link active">Keşfet</h:link>
                        <a class="devlog-nav-link" href="#">Kategoriler</a>
                        <a class="devlog-nav-link" href="#">Hakkımızda</a>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="position-relative d-none d-lg-block">
                        <input type="text" class="form-control devlog-search rounded-0 py-1 ps-3 pe-5" style="width: 16rem;"
                               placeholder="Dosya veya yazı ara..." aria-label="Ara"/>
                        <span class="material-symbols-outlined position-absolute end-0 top-50 translate-middle-y me-2 text-secondary">search</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn devlog-btn-login rounded-0 px-3 py-1">Giriş yap</button>
                        <button type="button" class="btn devlog-btn-signup rounded-0 px-3 py-1">Kayıt ol</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
</ui:composition>
