<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      lang="tr">
<h:head>
    <meta charset="utf-8"/>
    <ui:insert name="metadata"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="#{resource['img:Logo_Amblem.png']}" type="image/png"/>
    <title><ui:insert name="title">DevLog — Panel</ui:insert></title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <h:outputStylesheet library="css" name="devlog.css"/>
    <ui:insert name="headExtra"/>
</h:head>
<h:body styleClass="devlog-panel-body devlog-scrollbar">
    <ui:include src="/WEB-INF/fragments/panel_sidebar.xhtml"/>
    <div class="devlog-panel-wrap d-flex flex-column min-w-0">
        <ui:include src="/WEB-INF/fragments/panel_header.xhtml"/>
        <div class="container px-3 px-lg-4 pt-2 pb-0">
            <h:messages globalOnly="true" layout="block" styleClass="list-unstyled mb-0" warnClass="alert alert-warning rounded-0 small font-monospace border-0 mb-2"
                        infoClass="alert alert-info rounded-0 small font-monospace border-0 mb-2"
                        errorClass="alert alert-danger rounded-0 small font-monospace border-0 mb-2"/>
        </div>
        <main class="devlog-panel-content flex-grow-1 w-100 min-vh-0 py-4">
            <div class="container px-3 px-lg-4">
                <ui:insert name="content"/>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
