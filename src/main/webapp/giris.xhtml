<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/authTemplate.xhtml">

    <ui:define name="title">DevLog — Giriş</ui:define>

    <ui:define name="content">
        <main class="w-100" style="max-width: 440px;">
            <div class="text-center mb-4">
                <div class="devlog-auth-logo-box mx-auto mb-3">
                    <h:graphicImage library="img" name="Logo.png" alt="DevLog"/>
                </div>
                <h1 class="devlog-auth-title mb-2">DevLog'a hoş geldiniz</h1>
                <p class="devlog-auth-sub mb-0">Kimlik doğrulama terminali</p>
            </div>

            <section class="devlog-auth-card p-4 p-md-5">
                <h:form id="girisForm" styleClass="d-flex flex-column gap-4">
                    <h:panelGroup rendered="#{not empty giriController.hataMesaji}" styleClass="alert alert-danger border-0 rounded-0 py-2 small font-monospace mb-0" layout="block">
                        #{giriController.hataMesaji}
                    </h:panelGroup>

                    <div>
                        <h:outputLabel for="loginField" styleClass="form-label devlog-auth-sub mb-2 d-block">E-posta veya kullanıcı adı</h:outputLabel>
                        <h:inputText id="loginField" value="#{giriController.epostaVeyaKullaniciAdi}" styleClass="form-control devlog-auth-input py-3"
                                     required="true" requiredMessage="E-posta veya kullanıcı adı gerekli."/>
                    </div>
                    <div>
                        <h:outputLabel for="sifreField" styleClass="form-label devlog-auth-sub mb-2 d-block">Şifre</h:outputLabel>
                        <h:inputSecret id="sifreField" value="#{giriController.sifre}" styleClass="form-control devlog-auth-input py-3"
                                       required="true" requiredMessage="Şifre gerekli."/>
                    </div>

                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 small">
                        <div class="form-check">
                            <input class="form-check-input rounded-0 border-secondary" type="checkbox" id="beniHatirla" disabled="disabled"/>
                            <label class="form-check-label text-secondary font-monospace" for="beniHatirla">Beni hatırla</label>
                        </div>
                        <a href="#" class="text-decoration-none font-monospace small" style="color: var(--dl-secondary-border);">Şifremi unuttum</a>
                    </div>

                    <h:commandButton value="Giriş yap" action="#{giriController.girisYap}"
                                     styleClass="btn w-100 py-3 devlog-btn-signup rounded-0 text-uppercase fw-bold font-monospace small"/>
                </h:form>

                <div class="d-flex align-items-center gap-3 my-4">
                    <div class="flex-grow-1 border-top border-secondary"/>
                    <span class="devlog-auth-sub mb-0" style="letter-spacing: 0.2em;">veya</span>
                    <div class="flex-grow-1 border-top border-secondary"/>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn flex-fill border border-secondary devlog-auth-input py-2 rounded-0" disabled="disabled" title="Yakında">
                        <span class="material-symbols-outlined text-secondary">terminal</span>
                    </button>
                    <button type="button" class="btn flex-fill border border-secondary devlog-auth-input py-2 rounded-0" disabled="disabled" title="Yakında">
                        <span class="material-symbols-outlined text-secondary">code</span>
                    </button>
                </div>
            </section>

            <p class="text-center mt-4 small text-secondary font-monospace mb-0">
                Hesabınız yok mu?
                <h:link outcome="kayit" styleClass="text-decoration-none fw-bold ms-1" style="color: var(--dl-primary);">Kayıt olun</h:link>
            </p>

            <div class="devlog-auth-terminal-note p-3 mt-4 font-monospace small">
                <span style="color: var(--dl-secondary-border);">sys@devlog:~$</span> login --attempt=01<br/>
                <span style="color: var(--dl-tertiary);">UYARI:</span> Bağlantı TLS 1.3 ile güvence altında.<br/>
                <span style="color: var(--dl-primary);">TAMAM:</span> Sistem hazır.
            </div>
        </main>
    </ui:define>
</ui:composition>
